name: Build and Test

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-clang-debug
          - os: macos-latest
            preset: macos-clang-debug
          - os: windows-latest
            preset: windows-clang-debug

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: lukka/get-cmake@latest

      - name: Cache build directory
        uses: actions/cache@v6
        with:
          path: build/${{ matrix.preset }}
          key: build-${{ matrix.preset }}-${{ hashFiles('Source/**', 'ThirdParty/**', 'cmake/**', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            build-${{ matrix.preset }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev xorg-dev

      - name: Configure
        env:
          SLANG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
